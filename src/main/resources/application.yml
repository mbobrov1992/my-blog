spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/my_blog
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

logging:
  level:
    root: INFO

file:
  upload-dir: ${FILE_UPLOAD_DIR:${java.io.tmpdir}}/uploads